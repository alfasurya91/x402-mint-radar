[profile.default]
evm_version = "paris"
src = "contracts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/utils/Bytes.sol=contracts/vendor/Bytes.sol",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Aevum testnet
[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
